<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101622">
  <title>Pong — Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101622;
      color: #eef4ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: radial-gradient(ellipse at 50% 0%, #202c41 0%, #101622 62%);
    }

    .game-shell { width: min(940px, 100%); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 4px 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #7e91ad;
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.45rem); letter-spacing: -.06em; }

    .scoreboard { display: flex; align-items: center; gap: clamp(14px, 4vw, 34px); }
    .score { min-width: 46px; text-align: center; }
    .score-label { display: block; color: #8d9cb2; font-size: .68rem; font-weight: 700; letter-spacing: .13em; }
    .score-value { display: block; margin-top: 2px; font-size: 2rem; font-variant-numeric: tabular-nums; font-weight: 800; line-height: 1; }
    .score-divider { color: #526078; font-size: 1.3rem; }

    .court-wrap {
      overflow: hidden;
      border: 1px solid #334158;
      border-radius: 16px;
      background: #111a28;
      box-shadow: 0 24px 70px #0005, inset 0 1px #ffffff08;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 900 / 520;
      cursor: crosshair;
      touch-action: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 14px 4px 0;
    }

    .instructions { margin: 0; color: #9aa8bc; font-size: .85rem; line-height: 1.6; }
    kbd {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid #45536a;
      border-radius: 5px;
      background: #202b3c;
      color: #e7eefb;
      font: inherit;
      font-size: .76rem;
    }

    button {
      flex: 0 0 auto;
      padding: 9px 15px;
      border: 1px solid #394962;
      border-radius: 9px;
      background: #202b3c;
      color: #eef4ff;
      font: inherit;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    button:hover { background: #2b3a50; }
    button:active { transform: translateY(1px); }
    button:focus-visible, canvas:focus-visible { outline: 3px solid #45e0bd; outline-offset: 3px; }

    @media (max-width: 520px) {
      body { padding: 20px 12px; }
      header { align-items: center; }
      .score-value { font-size: 1.65rem; }
      .score { min-width: 35px; }
      .toolbar { align-items: start; }
      .instructions { font-size: .76rem; }
      button { padding: 8px 11px; font-size: .78rem; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">A little arcade classic</p>
        <h1>Pong</h1>
      </div>
      <section class="scoreboard" aria-label="Scoreboard">
        <div class="score"><span class="score-label">YOU</span><span class="score-value" id="player-score">0</span></div>
        <span class="score-divider" aria-hidden="true">:</span>
        <div class="score"><span class="score-label">CPU</span><span class="score-value" id="computer-score">0</span></div>
      </section>
    </header>

    <div class="court-wrap">
      <canvas id="game" width="900" height="520" tabindex="0" role="img" aria-label="Pong game. Move your mouse over the court or use the up and down arrow keys to control the left paddle."></canvas>
    </div>

    <div class="toolbar">
      <p class="instructions">Move your mouse over the court or use <kbd>↑</kbd> <kbd>↓</kbd> to move. First to 7 wins.</p>
      <button id="restart" type="button">New game</button>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const playerScoreEl = document.querySelector('#player-score');
      const computerScoreEl = document.querySelector('#computer-score');
      const restartButton = document.querySelector('#restart');
      const W = canvas.width;
      const H = canvas.height;
      const paddle = { width: 12, height: 92, inset: 34 };
      const keys = new Set();
      const colors = { court: '#111a28', line: '#29364a', paddle: '#45e0bd', cpu: '#a78bfa', ball: '#f5f8ff', text: '#dce6f5' };
      let playerY;
      let computerY;
      let ball;
      let playerScore;
      let computerScore;
      let pointMessage = '';
      let messageUntil = 0;
      let lastTime = 0;
      let finished = false;

      function resetBall(direction = Math.random() < 0.5 ? -1 : 1) {
        ball = {
          x: W / 2,
          y: H / 2,
          radius: 9,
          vx: direction * 5.2,
          vy: (Math.random() * 2 - 1) * 3.2
        };
      }

      function newGame() {
        playerScore = 0;
        computerScore = 0;
        playerY = computerY = H / 2;
        finished = false;
        pointMessage = '';
        playerScoreEl.textContent = '0';
        computerScoreEl.textContent = '0';
        resetBall();
      }

      function movePlayerTo(clientY) {
        const rect = canvas.getBoundingClientRect();
        const canvasY = (clientY - rect.top) * H / rect.height;
        playerY = Math.max(paddle.height / 2, Math.min(H - paddle.height / 2, canvasY));
      }

      canvas.addEventListener('pointermove', (event) => movePlayerTo(event.clientY));
      canvas.addEventListener('pointerdown', (event) => {
        canvas.focus();
        movePlayerTo(event.clientY);
      });

      window.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown'].includes(event.key)) {
          event.preventDefault();
          keys.add(event.key);
        }
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key));
      window.addEventListener('blur', () => keys.clear());
      restartButton.addEventListener('click', () => newGame());

      function scorePoint(playerWon) {
        if (playerWon) {
          playerScore += 1;
          playerScoreEl.textContent = String(playerScore);
          pointMessage = playerScore === 7 ? 'YOU WIN!' : 'POINT!';
        } else {
          computerScore += 1;
          computerScoreEl.textContent = String(computerScore);
          pointMessage = computerScore === 7 ? 'CPU WINS' : 'CPU SCORES';
        }
        finished = playerScore === 7 || computerScore === 7;
        messageUntil = performance.now() + (finished ? 60000 : 850);
        resetBall(playerWon ? 1 : -1);
      }

      function update(dt) {
        if (finished) return;

        const step = dt / 16.67;
        const playerSpeed = 7.3 * step;
        if (keys.has('ArrowUp')) playerY -= playerSpeed;
        if (keys.has('ArrowDown')) playerY += playerSpeed;
        playerY = Math.max(paddle.height / 2, Math.min(H - paddle.height / 2, playerY));

        // The computer tracks the ball, but its limited speed leaves room to score.
        const aiTarget = ball.y;
        const aiDelta = aiTarget - computerY;
        const aiSpeed = 4.25 * step;
        computerY += Math.sign(aiDelta) * Math.min(Math.abs(aiDelta), aiSpeed);
        computerY = Math.max(paddle.height / 2, Math.min(H - paddle.height / 2, computerY));

        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        // Bounce off the top and bottom edges.
        if (ball.y - ball.radius <= 0) {
          ball.y = ball.radius;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + ball.radius >= H) {
          ball.y = H - ball.radius;
          ball.vy = -Math.abs(ball.vy);
        }

        const playerX = paddle.inset;
        const cpuX = W - paddle.inset - paddle.width;

        // Paddle collisions add spin based on where the ball hits.
        if (ball.vx < 0 && ball.x - ball.radius <= playerX + paddle.width &&
            ball.x + ball.radius >= playerX && ball.y >= playerY - paddle.height / 2 &&
            ball.y <= playerY + paddle.height / 2) {
          ball.x = playerX + paddle.width + ball.radius;
          bounceFromPaddle(playerY, 1);
        }
        if (ball.vx > 0 && ball.x + ball.radius >= cpuX && ball.x - ball.radius <= cpuX + paddle.width &&
            ball.y >= computerY - paddle.height / 2 && ball.y <= computerY + paddle.height / 2) {
          ball.x = cpuX - ball.radius;
          bounceFromPaddle(computerY, -1);
        }

        if (ball.x + ball.radius < 0) scorePoint(false);
        else if (ball.x - ball.radius > W) scorePoint(true);
      }

      function bounceFromPaddle(centerY, direction) {
        const relativeHit = (ball.y - centerY) / (paddle.height / 2);
        const speed = Math.min(9.2, Math.hypot(ball.vx, ball.vy) + 0.28);
        const angle = relativeHit * (Math.PI / 3);
        ball.vx = direction * speed * Math.cos(angle);
        ball.vy = speed * Math.sin(angle);
      }

      function draw() {
        ctx.fillStyle = colors.court;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = colors.line;
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 13]);
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);

        drawPaddle(paddle.inset, playerY, colors.paddle);
        drawPaddle(W - paddle.inset - paddle.width, computerY, colors.cpu);

        ctx.fillStyle = colors.ball;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();

        if (performance.now() < messageUntil) {
          ctx.fillStyle = colors.text;
          ctx.textAlign = 'center';
          ctx.font = '800 30px system-ui, sans-serif';
          ctx.fillText(pointMessage, W / 2, H / 2 - 38);
          if (finished) {
            ctx.font = '500 15px system-ui, sans-serif';
            ctx.fillStyle = '#9aa8bc';
            ctx.fillText('Press “New game” to play again', W / 2, H / 2 - 10);
          }
        }
      }

      function drawPaddle(x, centerY, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x, centerY - paddle.height / 2, paddle.width, paddle.height, 6);
        ctx.fill();
      }

      function frame(now) {
        const dt = lastTime ? Math.min(now - lastTime, 40) : 16.67;
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      newGame();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
